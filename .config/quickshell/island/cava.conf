; Dedicated cava config for the island. Your main ~/.config/cava/config is untouched.
; Ported from the waybar cava module: 14 bars, pipewire, monstercat, 50-10000 Hz.

[general]
framerate = 60
bars = 14
lower_cutoff_freq = 50
higher_cutoff_freq = 10000
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
monstercat = 1
waves = 0
noise_reduction = 50
