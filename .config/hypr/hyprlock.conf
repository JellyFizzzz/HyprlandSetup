background {
    monitor =
    path = /usr/share/sddm/themes/pixie/assets/background.jpg
    blur_passes = 0
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.25
    outer_color = rgba(45, 40, 61, 1.0)
    inner_color = rgba(29, 32, 33, 1.0)
    font_color = rgba(212, 190, 152, 1.0)
    fade_on_empty = true
    placeholder_text = Password
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(212, 190, 152, 1.0)
    font_size = 64
    position = 0, 160
    halign = center
    valign = center
}
